<head>

    <!--/* Page configuration */-->
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <!--/* Page description */-->
    <title th:text="${pageTitle} ?: #{head.title}"></title>
    <meta name="description" th:content="${pageDescription} ?: #{head.description}">

    <!--/* Facebook Meta Tags */-->
    <meta content="https://facilitator.mogami.tech" property="og:url">
    <meta content="website" property="og:type">
    <meta content="Mogami Facilitator — Verify and Settle x402 Payments Instantly" property="og:title">
    <meta content="The Mogami Facilitator is your gateway to the x402 protocol — verifying and settling instant stablecoin payments directly over HTTP. Enable real-time, pay-per-call transactions for APIs, apps, and AI agents."
          property="og:description">
    <meta content="https://mogami.tech/images/og/mogami.png" property="og:image">

    <!--/* Twitter Meta Tags */-->
    <meta content="summary_large_image" name="twitter:card">
    <meta content="mogami.tech" property="twitter:domain">
    <meta content="https://facilitator.mogami.tech" property="twitter:url">
    <meta content="Mogami Facilitator — Verify and Settle x402 Payments Instantly" name="twitter:title">
    <meta content="Verify and settle x402 payments instantly. Power seamless monetization for APIs, apps, and AI agents."
          name="twitter:description">
    <meta content="https://mogami.tech/images/og/mogami.png" name="twitter:image">

    <!--/* Optional SEO / Extras */-->
    <meta content="x402, facilitator, mogami, stablecoin, USDC, API monetization, HTTP 402, payments, Java, Coinbase, Base, microtransactions"
          name="keywords">
    <meta content="Mogami Tech" name="author">
    <meta content="index, follow" name="robots">
    <link href="https://facilitator.mogami.tech/" rel="canonical">

    <!--/* Favicons */-->
    <link rel="apple-touch-icon" sizes="57x57" th:href="@{/images/favicon/apple-icon-57x57.png}">
    <link rel="apple-touch-icon" sizes="60x60" th:href="@{/images/favicon/apple-icon-60x60.png}">
    <link rel="apple-touch-icon" sizes="72x72" th:href="@{/images/favicon/apple-icon-72x72.png}">
    <link rel="apple-touch-icon" sizes="76x76" th:href="@{/images/favicon/apple-icon-76x76.png}">
    <link rel="apple-touch-icon" sizes="114x114" th:href="@{/images/favicon/apple-icon-114x114.png}">
    <link rel="apple-touch-icon" sizes="120x120" th:href="@{/images/favicon/apple-icon-120x120.png}">
    <link rel="apple-touch-icon" sizes="144x144" th:href="@{/images/favicon/apple-icon-144x144.png}">
    <link rel="apple-touch-icon" sizes="152x152" th:href="@{/images/favicon/apple-icon-152x152.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/images/favicon/apple-icon-180x180.png}">
    <link rel="icon" sizes="192x192" th:href="@{/images/favicon/android-icon-192x192.png}" type="image/png">
    <link rel="icon" sizes="32x32" th:href="@{/images/favicon/favicon-32x32.png}" type="image/png">
    <link rel="icon" sizes="96x96" th:href="@{/images/favicon/favicon-96x96.png}" type="image/png">
    <link rel="icon" sizes="16x16" th:href="@{/images/favicon/favicon-16x16.png}" type="image/png">
    <link rel="manifest" th:href="@{/images/favicon/manifest.json}">

    <!--/* Javascript */-->
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" type="text/javascript"></script>
    <script defer th:src="@{/webjars/alpinejs/dist/cdn.min.js}" type="text/javascript"></script>

    <!--/* CSS */-->
    <link rel="stylesheet" th:href="@{/css/application.css}">

</head>
